[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line too long — Black handles line length
    "B008",   # FastAPI Depends() in function defaults is intentional
]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["I001"]   # alembic-generated file; import order follows alembic convention

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = [
    "tests/*",
    # Legacy/dead files not imported by the active application
    "app/config.py",
    "app/db/base.py",
    "app/db/session.py",
    "app/routers/health.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 80
